name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check shell syntax
        run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - name: Test setup, recovery, and payload integrity
        run: python3 -m unittest discover -s tests -v
